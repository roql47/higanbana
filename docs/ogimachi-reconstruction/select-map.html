<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>맵 범위 직접 선택</title><style>*{box-sizing:border-box}body{margin:0;background:#131c25;color:#eef4f8;font:15px system-ui}header{padding:16px 22px;background:#202d39;display:flex;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:19px;margin:0 18px 0 0}button,select{background:#344859;color:white;border:1px solid #5b7183;border-radius:7px;padding:10px;cursor:pointer}button.active{background:#16765d;border-color:#70ffd1}p{margin:0;padding:10px 22px;color:#c0cfdb}canvas{display:block;touch-action:none}#note{margin-left:auto;color:#83e5c4}</style><header><h1>내가 정하는 맵 범위</h1><select id="mode"><option value="keep">유지 구역 그리기</option><option value="delete">삭제 구역 그리기</option><option value="pan">지도 이동</option></select><button id="undo">한 단계 취소</button><button id="fit">전체 보기</button><button id="save">선택 저장</button><button id="download">파일로 내보내기</button><span id="note">아직 맵은 삭제되지 않습니다</span></header><p>마우스를 누른 채 둘러 그리면 영역이 닫힙니다. 휠: 확대·축소 · 지도 이동 모드: 드래그 · 초록 선은 현재 스토리 도로입니다.</p><canvas id="map"></canvas><script type="module">
const data=await fetch('/data/ogimachi/survey.json').then(r=>{if(!r.ok)throw Error('지도 불러오기 실패');return r.json()});
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),mode=document.querySelector('#mode'),note=document.querySelector('#note');
const KEY='ogimachi-user-map-regions-v1';let shapes=[];try{shapes=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}
if(shapes.length)fetch('/__map-selection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(shapes)}).catch(()=>{});
let width,height,scale=1,ox=0,oy=0,stroke=null,drag=null;
const points=data.buildings.flatMap(b=>b.points);const minX=Math.min(...points.map(p=>p[0]))-150,maxX=Math.max(...points.map(p=>p[0]))+150,minZ=Math.min(...points.map(p=>p[1]))-150,maxZ=Math.max(...points.map(p=>p[1]))+150;
function fit(){scale=Math.min(width/(maxX-minX),height/(maxZ-minZ))*.92;ox=width/2-(minX+maxX)/2*scale;oy=height/2-(minZ+maxZ)/2*scale;draw()}
function resize(){width=innerWidth;height=innerHeight-canvas.getBoundingClientRect().top;canvas.width=width*devicePixelRatio;canvas.height=height*devicePixelRatio;canvas.style.width=width+'px';canvas.style.height=height+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);draw()}
function path(p){ctx.beginPath();p.forEach(([x,z],i)=>i?ctx.lineTo(x*scale+ox,z*scale+oy):ctx.moveTo(x*scale+ox,z*scale+oy))}
function region(s){path(s.points);ctx.closePath();ctx.fillStyle=s.type==='keep'?'#29e9a738':'#ff496438';ctx.strokeStyle=s.type==='keep'?'#55ffc0':'#ff637e';ctx.lineWidth=3;ctx.fill('evenodd');ctx.stroke()}
function draw(){ctx.clearRect(0,0,width,height);ctx.fillStyle='#17252e';ctx.fillRect(0,0,width,height);for(const r of data.roads){path(r.points);ctx.strokeStyle='#657e88';ctx.lineWidth=Math.max(1,3*scale);ctx.stroke()}for(const b of data.buildings){path(b.points);ctx.closePath();ctx.fillStyle='#b3aaa0';ctx.fill()}const road=data.roads.find(r=>r.id===1268046903);if(road){path(road.points);ctx.strokeStyle='#68e5b2';ctx.lineWidth=3;ctx.stroke()}shapes.forEach(region);if(stroke)region(stroke);ctx.fillStyle='#eff8ff';ctx.font='16px system-ui';ctx.fillText('북 ↑',24,32);const meters=Math.pow(10,Math.floor(Math.log10(150/scale)));ctx.fillRect(24,height-35,meters*scale,3);ctx.fillText(meters+' m',24,height-45);ctx.fillText('유지 '+shapes.filter(s=>s.type==='keep').length+'개 · 삭제 '+shapes.filter(s=>s.type==='delete').length+'개',24,60)}
function pos(e){const r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}function world(p){return[(p[0]-ox)/scale,(p[1]-oy)/scale]}
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);let p=pos(e);if(mode.value==='pan')drag=p;else stroke={type:mode.value,points:[world(p)]}};
canvas.onpointermove=e=>{let p=pos(e);if(drag){ox+=p[0]-drag[0];oy+=p[1]-drag[1];drag=p;draw()}else if(stroke){let q=world(p),last=stroke.points.at(-1);if(Math.hypot(q[0]-last[0],q[1]-last[1])*scale>3){stroke.points.push(q);draw()}}};
canvas.onpointerup=()=>{if(stroke&&stroke.points.length>=3){shapes.push(stroke);note.textContent='선택 변경됨 · 선택 저장을 눌러 주세요'}stroke=null;drag=null;draw()};canvas.onpointercancel=()=>{stroke=null;drag=null;draw()};
canvas.onwheel=e=>{e.preventDefault();let p=pos(e),w=world(p);scale=Math.max(.02,Math.min(30,scale*Math.exp(-e.deltaY*.001)));ox=p[0]-w[0]*scale;oy=p[1]-w[1]*scale;draw()};
document.querySelector('#undo').onclick=()=>{shapes.pop();draw();note.textContent='선택 변경됨'};document.querySelector('#fit').onclick=fit;
document.querySelector('#save').onclick=()=>{localStorage.setItem(KEY,JSON.stringify(shapes));fetch('/__map-selection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(shapes)}).catch(()=>{});note.textContent='이 브라우저에 저장했습니다 · 실제 맵 삭제 없음'};
document.querySelector('#download').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,origin:data.origin,regions:shapes},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ogimachi-selected-regions.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
window.addEventListener('resize',resize);resize();fit();
</script></html>
