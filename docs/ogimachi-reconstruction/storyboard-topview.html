<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오기마치 · 스토리보드 동선</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101b23;color:#eaf2f5;font:14px system-ui}header{padding:16px 22px;border-bottom:1px solid #40505d;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:21px;margin:0}button,select{background:#263b49;color:#fff;border:1px solid #617a87;border-radius:5px;padding:9px}main{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:calc(100vh - 78px)}.stage{position:relative;min-width:0;min-height:0}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}aside{padding:18px;overflow:auto;background:#182933}p{line-height:1.65;color:#b7cbd4}h2{font-size:17px}.row{padding:9px 0;border-bottom:1px solid #304550;cursor:pointer}.badge{font-size:11px;margin-left:8px}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}.muted{color:#adc1c9}a{color:#8fd8ff}@media(max-width:800px){main{grid-template-columns:1fr;height:auto}.stage{height:68vh}aside{height:40vh}}</style>
<header><h1>오기마치 · 스토리보드 동선</h1><select id="phase"><option value="early">ACT 1–7 · 도착과 첫 공물</option><option value="middle">ACT 8–16 · 공물과 진상 조사</option><option value="late">ACT 17–28 · 신사와 재방문</option><option value="escape">ACT 29–33 · 탈출</option><option value="all" selected>전체 동선</option></select><button id="fit">전체 보기</button><label><input type="checkbox" id="photo">항공사진</label></header>
<main><div class="stage"><canvas id="map" aria-label="북쪽이 위인 마을 탑뷰. 건물 이름과 단계별 이야기 이동 화살표"></canvas></div><aside><div class="legend"><span style="color:#69ddaf">● 모델 있음</span><span style="color:#ffc36a">● 제작 예정</span><span style="color:#bfb1ff">● 선택 장면 제안</span></div><h2 id="heading">도착과 첫 공물</h2><p id="description"></p><div id="steps"></div><h2>건물 · 장소 목록</h2><div id="sites"></div><p>화살표는 이야기상 순서입니다. 길을 따라 검증한 보행 경로가 아닙니다. 위치가 확정되지 않은 장소는 현재 배치 초안에 표시했습니다.</p><p>ACT 34–35 에필로그는 현재 마을 지도 밖 별도 장면입니다. 후기 액트의 세부 왕복·분기는 추가 설계가 필요합니다.</p><a href="/ogimachi.html?view=detail">3D 마을로 돌아가기</a></aside></main>
<script type="module">
const [data,layout,regions]=await Promise.all(['/data/ogimachi/survey.json','/data/ogimachi/story-layout.json','/data/ogimachi/story-selection.json'].map(async u=>{const r=await fetch(u);if(!r.ok)throw Error(u);return r.json()}));
const colors={built:'#69ddaf',planned:'#ffc36a',optional:'#bfb1ff'};
const built=new Set(['intro','shrine','school','hokora','well']);
const nodes=layout.sites.map(p=>({...p,name:p.id==='intro'?'종점 · 시작 구간':p.id==='square'?'축제 광장 · 기록 창고':p.id==='shrine'?'중앙 신사 (지하 예정)':p.name,state:built.has(p.id)?'built':'planned',note:built.has(p.id)?'모델/공간 있음 · 액트 전체 완성과는 별개':'배치 초안 · 제작 예정'}));
for(const [id,key,name,state,note] of [[236248693,'hakusuien','B001 백수원','built','실제 마을 건물 · 배경'],[236248710,'irori','B002 이로리 식당','built','실제 마을 건물 · 배경'],[236248704,'shop','B002-S 이로리 매점','built','실제 마을 건물 · 배경'],[236248644,'mori','B003 전승관','built','ACT 4 · TV 조사 공간'],[236248626,'onsen','B004 온천','optional','외관 모델 있음 · 온천 선택 장면은 제안 단계']]){const b=data.buildings.find(b=>b.id===id);if(b)nodes.push({id:key,name,position:[b.x,b.z],state,note,buildingId:id})}
const byId=new Map(nodes.map(n=>[n.id,n]));
const phases={
 early:{title:'ACT 1–7 · 도착과 첫 공물',description:'도착 → 생활 흔적과 전승관 조사 → 중앙 신사 → 오래된 사당 → 첫 봉납. 온천 방문은 아직 확정되지 않은 선택 장면입니다.',chains:[['intro','square','mori','shrine','hokora','shrine']],optional:[['mori','onsen','shrine']]},
 middle:{title:'ACT 8–16 · 공물과 진상 조사',description:'폐교(8–9), 우물(10–11), 묘지(12), 폐여관(13–14), 촌장 저택(15), 마을 기록 재조사(16). 신사 귀환을 포함한 주요 순서를 요약했습니다.',chains:[['shrine','school','shrine','well','shrine','cemetery','shrine','inn','shrine','manor'],['manor','square','grandma']],optional:[]},
 late:{title:'ACT 17–28 · 신사와 재방문',description:'중앙 신사·지하가 중심인 후반부. ACT 25의 각 장소 재방문을 점선 가지로 표시합니다. 가지의 방문 순서는 확정 동선이 아닙니다.',chains:[['grandma','shrine']],optional:[...['school','hokora','well','cemetery','inn','manor','grandma','square'].map(id=>['shrine',id,'shrine'])]},
 escape:{title:'ACT 29–33 · 마지막 탈출',description:'마을에서 논길을 거쳐 피안화 탈출길로 나가는 배치 제안입니다. 실제 탈출 통로의 지형·충돌과 연출은 별도 제작 대상입니다.',chains:[['shrine','paddy','escape']],optional:[]}
};
let phase='all',chosen=null,w=1,h=1,scale=1,ox=0,oy=0,drag=null,moved=false;
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),photo=new Image();photo.src='/data/ogimachi/orthophoto.webp';photo.onload=()=>draw();
const point=p=>[p[0]*scale+ox,p[1]*scale+oy];
function polygon(points){ctx.beginPath();points.forEach((p,i)=>{const [x,y]=point(p);i?ctx.lineTo(x,y):ctx.moveTo(x,y)})}
function fit(){const ps=nodes.map(n=>n.position);const xs=ps.map(p=>p[0]),zs=ps.map(p=>p[1]);scale=Math.min((w-290)/(Math.max(...xs)-Math.min(...xs)),(h-100)/(Math.max(...zs)-Math.min(...zs)));scale=Math.max(.12,scale);ox=w/2-(Math.max(...xs)+Math.min(...xs))*scale/2;oy=h/2-(Math.max(...zs)+Math.min(...zs))*scale/2;draw()}
function arrow(a,b,color,dashed){const [x,y]=point(a),[u,v]=point(b),dx=u-x,dy=v-y,len=Math.hypot(dx,dy);if(len<1)return;ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=2;ctx.setLineDash(dashed?[5,6]:[]);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(u,v);ctx.stroke();ctx.setLineDash([]);const mx=x+dx*.63,my=y+dy*.63,ang=Math.atan2(dy,dx);ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(mx-10*Math.cos(ang-.45),my-10*Math.sin(ang-.45));ctx.lineTo(mx-10*Math.cos(ang+.45),my-10*Math.sin(ang+.45));ctx.closePath();ctx.fill()}
function draw(){ctx.clearRect(0,0,w,h);ctx.fillStyle='#101b23';ctx.fillRect(0,0,w,h);if(document.querySelector('#photo').checked&&photo.complete&&photo.naturalWidth){const p=data.photo,[x,y]=point([p.minX,p.minZ]);ctx.globalAlpha=.5;ctx.drawImage(photo,x,y,(p.maxX-p.minX)*scale,(p.maxZ-p.minZ)*scale);ctx.globalAlpha=1}for(const r of regions){polygon(r.points);ctx.closePath();ctx.strokeStyle='#416a59';ctx.lineWidth=1;ctx.stroke()}for(const r of data.roads){polygon(r.points);ctx.strokeStyle='#48616d';ctx.lineWidth=Math.max(1,(r.width??3)*scale);ctx.stroke()}for(const b of data.buildings){polygon(b.points);ctx.closePath();ctx.fillStyle='#72848b';ctx.fill()}
 const shown=phase==='all'?Object.values(phases):[phases[phase]];shown.forEach((p,i)=>{for(const c of p.chains)for(let j=1;j<c.length;j++)arrow(byId.get(c[j-1]).position,byId.get(c[j]).position,['#72d8ff','#ffcf76','#f39eaa','#daabff'][phase==='all'?i:Object.keys(phases).indexOf(phase)],false);for(const c of p.optional)for(let j=1;j<c.length;j++)arrow(byId.get(c[j-1]).position,byId.get(c[j]).position,'#bfb1ff99',true)});
 // Screen-space label columns prevent the central village names from overlapping.
 const sides=[[],[]];nodes.forEach((n,i)=>{const [x,y]=point(n.position);if(x<0||x>w||y<0||y>h)return;sides[n.position[0]<-210?0:1].push({n,i,x,y})});
 for(let side=0;side<2;side++){const list=sides[side].sort((a,b)=>a.y-b.y),gap=Math.min(32,(h-80)/Math.max(1,list.length));let last=30;for(let i=0;i<list.length;i++){const a=list[i],yy=Math.max(last,Math.min(a.y,h-30-(list.length-1-i)*gap));last=yy+gap;const xx=side===0?14:w-191;ctx.strokeStyle=colors[a.n.state]+'88';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(side===0?xx+178:xx,yy);ctx.stroke();ctx.fillStyle=chosen===a.n.id?'#486077':'#152833ef';ctx.fillRect(xx,yy-12,178,25);ctx.fillStyle=colors[a.n.state];ctx.font='12px system-ui';ctx.fillText(a.n.name,xx+7,yy+5);ctx.beginPath();ctx.arc(a.x,a.y,chosen===a.n.id?7:4,0,Math.PI*2);ctx.fill()}}
 ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.fillText('N ↑ 북쪽',20,23);ctx.font='12px system-ui';ctx.fillText('실제 지도 좌표 · 화살표는 이야기 순서 / 점선은 선택·재방문',20,h-12)}
function select(id){chosen=id;const n=byId.get(id);document.querySelector('#heading').textContent=n.name;document.querySelector('#description').textContent=n.note+(n.acts?' · ACT '+n.acts:'');draw()}
for(const n of nodes){const row=document.createElement('div');row.className='row';row.style.color=colors[n.state];row.textContent=n.name;row.onclick=()=>select(n.id);document.querySelector('#sites').append(row)}
function update(){const p=phases[phase];document.querySelector('#heading').textContent=p?.title??'전체 동선';document.querySelector('#description').textContent=p?.description??'여러 시기의 동선을 한 지도에 겹쳐 표시합니다. 단계별 보기를 선택하면 순서를 더 쉽게 확인할 수 있습니다.';const area=document.querySelector('#steps');area.replaceChildren();for(const c of p?.chains??[]){const el=document.createElement('p');el.textContent=c.map(id=>byId.get(id).name).join(' → ');area.append(el)}draw()}
document.querySelector('#phase').onchange=e=>{phase=e.target.value;chosen=null;update()};document.querySelector('#fit').onclick=fit;document.querySelector('#photo').onchange=draw;
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];moved=false;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag[0],dy=e.clientY-drag[1];moved=moved||Math.hypot(dx,dy)>2;ox+=dx;oy+=dy;drag=[e.clientX,e.clientY];draw()};canvas.onpointerup=e=>{if(!moved){const r=canvas.getBoundingClientRect();const n=nodes.find(n=>{const [x,y]=point(n.position);return Math.hypot(x-e.clientX+r.left,y-e.clientY+r.top)<12});if(n)select(n.id)}drag=null};canvas.onpointercancel=()=>drag=null;
canvas.onwheel=e=>{e.preventDefault();const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,n=Math.max(.1,Math.min(6,scale*Math.exp(-e.deltaY*.001)));ox=x-(x-ox)*n/scale;oy=y-(y-oy)*n/scale;scale=n;draw()};new ResizeObserver(()=>{w=canvas.clientWidth;h=canvas.clientHeight;canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);fit()}).observe(document.querySelector('.stage'));update();
</script></html>
