const scene=new T.Scene();scene.background=new T.Color('#b6c0c2');const camera=new T.PerspectiveCamera(43,innerWidth/innerHeight,.1,150);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.maxPolarAngle=Math.PI/2-.03;controls.minDistance=2;controls.maxDistance=60;
