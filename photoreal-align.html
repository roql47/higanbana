<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이로리 · 원본 겹쳐 보기</title><style>*{box-sizing:border-box}body{margin:0;background:#171d1a;color:#eee;font:14px system-ui}header{padding:16px 20px}h1{font-size:19px;margin:0 0 8px}p{font-size:13px;color:#acb9b1;margin:6px 0}nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}button,a{background:#2c3931;color:#eee;border:1px solid #5c6b61;border-radius:5px;padding:7px 12px;text-decoration:none;cursor:pointer}select{background:#2c3931;color:#eee;border:1px solid #5c6b61;border-radius:5px;padding:7px}button[aria-pressed=true]{background:#58765f}input{flex:1;min-width:130px}main{padding:0 12px 20px}.stage{position:relative;width:100%;max-width:1224px;aspect-ratio:612/500;overflow:hidden;background:#222}.stage img{position:absolute;width:100%;height:100%;object-fit:fill}.stage #model{opacity:.5}.guides{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,#ffffff30 1px,transparent 1px),linear-gradient(to bottom,#ffffff30 1px,transparent 1px);background-size:10% 10%;display:none}.small{margin-top:10px;line-height:1.7;color:#aebbb2}</style><header><h1>이로리 입구 · 원본 겹쳐 보기</h1><p>같은 화면 크기에서 원본과 제작 렌더를 비교합니다. 실측 복원이나 일치율 측정은 아닙니다.</p><nav><button id="reference">원본만</button><button id="render">제작본만</button><button id="overlay" aria-pressed="true">겹쳐 보기</button><button id="grid">격자</button><label for="revision">제작본 </label><select id="revision" aria-label="제작본 버전"><option value="sign-v7-final.png">간판 교정 후</option><option value="alignment-v4-final.png">텍스처 적용 전</option></select></nav><nav><span>제작본 농도</span><input id="opacity" type="range" min="0" max="100" value="50" aria-label="제작본 농도"><output id="value">50%</output></nav></header><main><div class="stage"><img id="photo" alt="이로리 공식 입구 사진" src="https://static.wixstatic.com/media/214b5e_a475e36f894049f2a299871a0c20e8b4~mv2_d_6000_4000_s_4_2.jpg/v1/crop/x_1176%2Cy_0%2Cw_4824%2Ch_3991/fill/w_612%2Ch_500%2Cal_c%2Cq_80%2Cusm_0.66_1.00_0.01%2Cenc_avif%2Cquality_auto/DSC_0198%E3%81%84%E3%82%8D%E3%82%8A%E5%A4%96%E8%A6%B3%E6%9A%97%E3%81%8F.jpg"><img id="model" alt="제작 렌더" src="/artifacts/ogimachi-phases/sign-v7-final.png"><div class="guides"></div></div><p class="small">기준: 문 바깥틀과 문턱을 먼저 맞춘 뒤 처마·간판·창호 비례를 확인합니다.<br>상세·플레이 맵에 적용하는 건물 작업본입니다.</p><a href="/photoreal-compare.html">나란히 비교</a> <a href="https://www.shirakawagou.jp/" target="_blank" rel="noopener">사진 출처</a></main><script>const slider=document.querySelector('#opacity'),model=document.querySelector('#model'),value=document.querySelector('#value');function set(v){slider.value=v;model.style.opacity=v/100;value.textContent=v+'%';for(const id of ['reference','render','overlay'])document.getElementById(id).setAttribute('aria-pressed',String((id==='reference'&&v===0)||(id==='render'&&v===100)||(id==='overlay'&&v>0&&v<100)))}slider.oninput=()=>set(+slider.value);document.querySelector('#reference').onclick=()=>set(0);document.querySelector('#render').onclick=()=>set(100);document.querySelector('#overlay').onclick=()=>set(50);document.querySelector('#grid').onclick=()=>{const el=document.querySelector('.guides');el.style.display=el.style.display==='block'?'none':'block'};document.querySelector('#revision').onchange=e=>{model.src='/artifacts/ogimachi-phases/'+e.target.value};</script></html>
