<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="히간바나 — 사람 없는 여름밤 마츠리. 초칭 하나를 들고 신사로." />
    <meta name="theme-color" content="#0a0f1a" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏮</text></svg>" />
    <title>히간바나 (彼岸花)</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="loading">
      <div class="loading-inner">
        <div class="loading-title">히간바나</div>
        <div class="loading-sub">여름밤 마을로 들어서는 중…</div>
        <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
        <div class="loading-pct" id="loading-pct">0%</div>
        <button class="start-btn" id="start-btn" hidden>클릭해서 시작</button>
      </div>
    </div>
    <div id="hud">
      <div id="hint" class="hint">
        <div class="hint-title">클릭해서 조작 시작</div>
        <div class="hint-keys">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동 · <kbd>Shift</kbd> 달리기</span>
          <span><kbd>Q</kbd> 초칭 밝기 (끔 · 약 · 강)</span>
          <span><kbd>마우스</kbd> 시점 · <kbd>휠</kbd> 줌</span>
          <span><kbd>R</kbd> 리셋 · <kbd>M</kbd> 음소거 · <kbd>F</kbd> 전체화면 · <kbd>H</kbd> 설정</span>
        </div>
      </div>
      <div id="stats" class="stats"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
