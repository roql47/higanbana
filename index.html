<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="description" content="브라우저에서 오픈월드처럼 움직이는 3D 캐릭터 — 초원 섬 산책" />
    <meta name="theme-color" content="#12110f" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
    <title>3D_motion — 초원 섬</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="loading">
      <div class="loading-inner">
        <div class="loading-title">3D_motion</div>
        <div class="loading-sub">초원 섬을 불러오는 중…</div>
        <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
        <div class="loading-pct" id="loading-pct">0%</div>
        <button class="start-btn" id="start-btn" hidden>클릭해서 시작</button>
      </div>
    </div>
    <div id="hud">
      <div id="hint" class="hint">
        <div class="hint-title">클릭해서 조작 시작</div>
        <div class="hint-keys">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동</span>
          <span><kbd>Shift</kbd> 걷기</span>
          <span><kbd>Space</kbd> 점프 · <kbd>좌클릭</kbd>/<kbd>J</kbd> 공격(연타 3콤보)</span>
          <span><kbd>Tab</kbd> 인벤토리 · <kbd>E</kbd> 줍기</span>
          <span><kbd>마우스</kbd> 시점 · <kbd>휠</kbd> 줌</span>
          <span><kbd>R</kbd> 리셋 · <kbd>M</kbd> 음소거 · <kbd>F</kbd> 전체화면 · <kbd>H</kbd> 설정</span>
        </div>
      </div>
      <div id="stats" class="stats"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
